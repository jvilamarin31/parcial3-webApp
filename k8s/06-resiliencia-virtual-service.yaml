# ==========================================
# MICROPRODUCTS
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: microproducts-retry-timeout
  namespace: default
spec:
  hosts:
    - microproducts
  http:
    - route:
        - destination:
            host: microproducts
            port:
              number: 5003
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: 5xx,reset,connect-failure

