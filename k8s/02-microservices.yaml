# ==========================================
# FRONTEND
# ==========================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbe: "true"
        proxy.istio.io/config: |
          proxyStatsMatcher:
            inclusionRegexps:
              - ".*outlier_detection.*"
    spec:
      containers:
      - name: frontend
        image: juanvila310/frontend:v2 # Aqui va la imagen de dockerhub con su versión
        ports:
        - containerPort: 5001
        env:
        - name: USERS_SERVICE_URL
          value: "http://microusers:5002"
        - name: PRODUCTS_SERVICE_URL
          value: "http://microproducts:5003"
        - name: ORDERS_SERVICE_URL
          value: "http://microorders:5004"
        - name: SECRET_KEY
          value: "secret123"
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
        readinessProbe:
          httpGet: {path: /health, port: 5001}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 5001}
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 5001
      targetPort: 5001