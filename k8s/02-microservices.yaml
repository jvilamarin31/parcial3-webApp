# ==========================================
# MICROUSERS
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microusers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microusers
  template:
    metadata:
      labels:
        app: microusers
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbe: "true"
    spec:
      containers:
      - name: microusers
        image: juanvila310/microusers:v2 # Aqui va la imagen de dockerhub con su versión
        ports:
        - containerPort: 5002
        env:
        - name: MYSQL_HOST
          value: "users-db-service"
        - name: MYSQL_USER
          value: "app"
        - name: MYSQL_PASSWORD
          value: "app_password"
        - name: MYSQL_DB
          value: "users_db"
        - name: SECRET_KEY
          value: "secret123"
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
        readinessProbe:
          httpGet: {path: /health, port: 5002}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 5002}
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: microusers
spec:
  selector:
    app: microusers
  ports:
    - port: 5002
      targetPort: 5002

