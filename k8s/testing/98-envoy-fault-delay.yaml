apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: server-delay-microproducts
  namespace: default
spec:
  workloadSelector:
    labels:
      app: microproducts
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: "envoy.filters.http.fault"
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault"
            delay:
              fixed_delay: 2s
              percentage:
                numerator: 100
                denominator: HUNDRED